# nginx/default.conf
# Nginx vhost for the React SPA + reverse-proxy to Flask backend.
# This file is copied into the frontend Docker image at build time.
#
# In Docker Compose the Flask container is reachable at http://backend:5000
# (Docker DNS resolves "backend" to the container).

upstream flask_api {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── React SPA (static files) ─────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets forever; index.html must never be cached
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # All /api/* requests → Flask backend
    location /api/ {
        proxy_pass         http://flask_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large CSV/XLSX uploads
        client_max_body_size 32m;
        proxy_read_timeout   120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # React SPA fallback — serve index.html for all unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
